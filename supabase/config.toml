project_id = "habit-tracker"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["habittracker://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
# Personal use should not open with a login wall; an anonymous user is a real
# auth.users row, so RLS applies identically and it can be upgraded to email later.
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = false

[functions.ambiguity-check]
verify_jwt = true

[functions.schedule-merge]
verify_jwt = true

[functions.identity-reflection]
verify_jwt = true
